[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-flood"
version = "0.1.0"
description = "Public-data flood exposure research for African cultural institutions"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heritage_flood = ["web/*.html", "web/*.css", "web/*.js"]
