name: Validate and deploy heritage maps

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check_pages.py'
      - 'scripts/check_map_style.mjs'
      - 'src/heritage_flood/web/public/**'
      - 'src/heritage_flood/publication.py'
      - 'tests/web/**'
      - 'tests/test_publication.py'
      - 'tests/test_pages_validation.py'
      - 'package*.json'
      - 'metadata/datasets.csv'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_pages.py'
      - 'scripts/check_map_style.mjs'
      - 'src/heritage_flood/web/public/**'
      - 'src/heritage_flood/publication.py'
      - 'tests/web/**'
      - 'tests/test_publication.py'
      - 'tests/test_pages_validation.py'
      - 'package*.json'
      - 'metadata/datasets.csv'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install validation tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check map behavior and style
        run: |
          npm test
          npm run check:style
      - name: Check public packaging and validator behavior
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_publication.py -v
          python -m unittest discover -s tests -p test_pages_validation.py -v
      - name: Validate retained public snapshots
        run: python scripts/check_pages.py
      - name: Check map JavaScript syntax
        run: |
          for script in src/heritage_flood/web/public/*.mjs docs/assets/maps/*.mjs; do
            node --check "$script"
          done

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Upload public website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
